name: Build Zel Signals APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install Node dependencies
        run: npm install

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export PATH=/tmp/gradle-8.11.1/bin:$PATH
          gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify APK
        run: |
          APK=$(find android -name "*.apk" -path "*release*" ! -name "unsigned.apk" ! -name "aligned.apk" | head -n1)
          echo "APK: $APK"
          ls -lh "$APK"
          unzip -l "$APK" | grep -E "classes.dex|resources.arsc|AndroidManifest|assets/public/index.html"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zel-signals-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
